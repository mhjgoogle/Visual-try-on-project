name: CI

# Ubuntu is the authoritative environment (AGENTS.md §2); the Windows job is the
# reproducible native-Windows verification of record for ADR-0049. Both must be
# green. FFmpeg-dependent tests self-skip when ffmpeg is absent, so we install it
# on both runners to actually exercise the render/ffprobe paths.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Ubuntu (authoritative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Separate steps: a multi-line run under PowerShell (windows-latest's
      # default shell) only surfaces the LAST command's exit status, so a
      # combined "ruff check; ruff format --check" could pass despite a lint
      # failure. One command per step makes each failure fail the job.
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: python -m pytest -q
      - name: Frontend unit tests (motv mockup)
        run: node --test mockups/motv-workspace/tests/*.test.mjs

  windows:
    name: Windows (native, ADR-0049)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install project (editable) + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Separate steps: a multi-line run under PowerShell (windows-latest's
      # default shell) only surfaces the LAST command's exit status, so a
      # combined "ruff check; ruff format --check" could pass despite a lint
      # failure. One command per step makes each failure fail the job.
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest
        run: python -m pytest -q
      - name: Frontend unit tests (motv mockup)
        run: node --test mockups/motv-workspace/tests/*.test.mjs
